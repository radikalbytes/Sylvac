<main class="container">
  <h1>Bienvenido a mierder test</h1>

  <div class="row">
    <a href="https://tauri.app" target="_blank">
      <img src="/assets/tauri.svg" class="logo tauri" alt="Tauri logo" />
    </a>
    <a href="https://webpisolutions.com" target="_blank">
      <img src="/assets/webpi.png" class="logo angular" alt="WebPi logo" />
    </a>
  </div>
  <p>Clickea por ahi si te atreves</p>

  <form class="row" (submit)="greet($event, greetInput.value)">
    <input #greetInput id="greet-input" placeholder="Escribe un nombre..." />
    <button type="submit">Gracias</button>
  </form>
  <p>{{ greetingMessage }}</p>
</main>
